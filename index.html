
  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels - Edición Especial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tarjeta de Colección */
        .card {
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            border: 3px solid #ff4500;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "1/1 UNICO";
            position: absolute;
            top: 15px;
            right: -30px;
            background: #ffcc00;
            color: #000;
            font-weight: bold;
            padding: 5px 35px;
            transform: rotate(45deg);
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* Encabezado Hot Wheels */
        .brand {
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            color: #ffcc00;
            text-shadow: 3px 3px 0px #ff4500;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: #c5c6c7;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Icono / Auto */
        .car-display {
            font-size: 70px;
            margin: 20px 0;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .vroom {
            animation: accelerate 0.6s infinite alternate ease-in-out;
        }

        @keyframes accelerate {
            0% { transform: translateX(-5px) scale(1); }
            100% { transform: translateX(10px) scale(1.05); }
        }

        /* Specs */
        .specs {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
            border-left: 4px solid #ff4500;
        }

        .specs p {
            margin: 8px 0;
            color: #c5c6c7;
        }

        .specs strong {
            color: #fff;
        }

        /* Botón de encendido */
        .btn-start {
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.6);
        }

        /* Mensaje final */
        .message {
            margin-top: 20px;
            font-size: 15px;
            color: #ffcc00;
            font-weight: 600;
            min-height: 45px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">HOT WHEELS</div>
        <div class="subtitle">Edición Especial de Colección</div>

        <div id="car" class="car-display">🏎️</div>

        <div class="specs">
            <p><strong>Modelo:</strong> Liu</p>
            <p><strong>Serie:</strong> Mi Persona Favorita ❤️</p>
            <p><strong>Motor:</strong> Acelera mi corazón a 1000 RPM</p>
            <p><strong>Condición:</strong> El más valioso del garaje</p>
        </div>

        <button class="btn-start" onclick="startEngine()">🔥 Arrancar Motor</button>

        <div id="msg" class="message">¡Presiona el botón para encender la pasión!</div>
    </div>

    <script>
        function startEngine() {
            const car = document.getElementById('car');
            const msg = document.getElementById('msg');
            
            // Efecto visual de movimiento
            car.classList.add('vroom');
            msg.style.color = '#00ffcc';
            msg.innerText = "🔊 ¡VROOOOM! Motores rugiendo a toda velocidad...";

            setTimeout(() => {
                car.classList.remove('vroom');
                msg.style.color = '#ffcc00';
                msg.innerText = "🏆 De todas las colecciones del mundo, tú eres mi auto favorito. ¡Feliz Día de los Hot Wheels!";
            }, 2500);
        }
    </script>

</body>
</html>
